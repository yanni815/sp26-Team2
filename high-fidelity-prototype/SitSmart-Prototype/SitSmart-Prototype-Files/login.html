<!DOCTYPE html>
<html>
    <head>
        <title>SitSmart - Parent Login</title>
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>
        <div class="container" style="max-width: 400px; margin:auto; margin-top: 100px;">
            <div class="card">
                <h2>SitSmart Parent Login</h2>

                <form id="loginForm">
                    <label>Email</label><br>
                    <input type="email" id="email" style="width:100%; padding:8px;" required><br><br>

                    <label>Password</label><br>
                    <input type="password" id="password" style="width:100%; padding:8px;" required><br><br>

                    <button type="submit" style="width:100%;">Login</button>
                </form>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
