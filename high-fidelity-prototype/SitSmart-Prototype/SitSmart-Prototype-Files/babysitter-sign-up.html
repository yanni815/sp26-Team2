<!DOCTYPE html>
<html>
<head>
    <title>SitSmart - Babysitter Sign Up</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="container" style="max-width: 500px; margin:auto; margin-top: 50px;">
    <div class="card">
        <h2>Create Babysitter Profile</h2>

        <form id="babysitterSignupForm">
            <label>Full Name</label>
            <input type="text" id="signupName" required>

            <label>Email</label>
            <input type="email" id="signupEmail" required>

            <label>Password</label>
            <input type="password" id="signupPassword" required>

            <label>Phone Number</label>
            <input type="text" id="signupPhone" required>

            <label>Hourly Rate ($)</label>
            <input type="number" id="signupRate" min="0" step="0.01" required>

            <br><br>

            <button type="submit" class="green-btn" style="width:100%;">Create Account</button>
        </form>

        <p id="signupMessage" style="margin-top:15px;"></p>

        <p style="margin-top:15px;">
            Already have an account?
            <a href="babysitter-login.html">Login here</a>
        </p>
    </div>
</div>

<script src="babysitter.js"></script>
</body>
</html>
