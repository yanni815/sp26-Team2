<!DOCTYPE html>
<html>
<head>
    <title>SitSmart - Babysitter Login</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="container" style="max-width: 400px; margin:auto; margin-top: 100px;">
    <div class="card">
        <h2>SitSmart Babysitter Login</h2>

        <form id="babysitterLoginForm">
            <label>Email</label>
            <input type="email" id="loginEmail" required>

            <br><br>

            <label>Password</label>
            <input type="password" id="loginPassword" required>

            <br><br>

            <button type="submit" style="width:100%;">Login</button>
        </form>

        <p id="loginMessage" style="margin-top:15px;"></p>

        <br>
        <p>Don't have an account?</p>
        <a href="babysitter-sign-up.html">
            <button class="green-btn" style="width:100%;">Sign Up</button>
        </a>
    </div>
</div>
 <script src="babysitter.js"></script>
</body>
</html>
