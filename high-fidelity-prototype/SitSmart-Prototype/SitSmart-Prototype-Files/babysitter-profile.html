<!DOCTYPE html>
<html>
<head>
    <title>SitSmart - Manage Profile</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="navbar">
    <div><strong>SitSmart</strong></div>
    <div>
        <a href="babysitter-dashboard.html">Dashboard</a>
        <a href="babysitter-bookings.html">My Jobs</a>
        <a href="babysitter-login.html">Logout</a>
    </div>
</div>

<div class="container">
    <div class="card">
        <h2>Edit Profile</h2>

        <form id="babysitterProfileForm">
            <label>Full Name</label>
            <input type="text" id="profileName" required>

            <label>Email</label>
            <input type="email" id="profileEmail" required>

            <label>Password</label>
            <input type="password" id="profilePassword" required>

            <label>Phone Number</label>
            <input type="text" id="profilePhone" required>

            <label>Hourly Rate</label>
            <input type="number" id="profileRate" min="0" step="0.01" required>

            <label>Rating</label>
            <input type="number" id="profileRating" min="0" max="5" step="0.1">

            <label>Verified Status</label>
            <input type="text" id="profileVerified" readonly>

            <label>Bio</label>
            <input type="text" id="profileBio" placeholder="Optional">

            <label>Availability</label>
            <input type="text" id="profileAvailability" placeholder="Optional">

            <br><br>

            <div class="card">
            <h3>Reviews</h3>
            <div id="reviewsContainer"></div>
            <input type="text" id="reviewInput" placeholder="Write a review">
            <button onclick="addReview()">Submit Review</button>
            </div>

            <button type="button" class="delete-btn" onclick="deleteBabysitterProfile()">
            Delete Profile
            </button>

            <button type="submit" class="green-btn">Save Changes</button>
        </form>

        <p id="profileMessage" style="margin-top:15px;"></p>
    </div>
</div>

<script src="babysitter.js"></script>
</body>
</html>
