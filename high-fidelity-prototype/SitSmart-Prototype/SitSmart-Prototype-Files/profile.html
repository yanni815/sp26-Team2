<!DOCTYPE html>
<html>
<head>
    <title>SitSmart - Babysitter Profile</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="navbar">
        <div><strong>SitSmart</strong></div>
        <div>
            <a href="dashboard.html">Dashboard</a>
            <a href="index.html">Browse</a>
            <a href="bookings.html">My Bookings</a>
            <a href="messages.html">Messages</a>
            <a href="login.html">Logout</a>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <h2 id="name"></h2>
            <p id="rating"></p>
            <p id="rate"></p>
            <p id="verified"></p>
            <p id="bio"></p>
            <p id="availability"></p>

            <a id="bookLink">
                <button class="green-btn">Book Now</button>
            </a>

            <h3>Message Babysitter</h3>
            <a id="messageLink">
                <button class="green-btn">Message Babysitter</button>
            </a>

            <h3>Reviews</h3>
            <div id="reviewsContainer"></div>

            <div class="card" style="margin-top:20px;">
                <h3>Leave a Review</h3>
                <form id="reviewForm">
                    <label>Rating</label>
                    <input type="number" id="reviewRating" min="1" max="5" step="1" value="5">

                    <label>Comment</label>
                    <input type="text" id="reviewInput" placeholder="Write a review">

                    <br><br>
                    <button type="submit">Submit Review</button>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
