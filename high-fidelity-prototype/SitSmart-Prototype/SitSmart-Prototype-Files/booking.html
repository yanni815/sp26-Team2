<!DOCTYPE html>
<html>
<head>
    <title>SitSmart - Booking</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="navbar">
        <div><strong>SitSmart</strong></div>
        <div>
            <a href="dashboard.html">Dashboard</a>
            <a href="index.html">Browse</a>
            <a href="bookings.html">My Bookings</a>
            <a href="messages.html">Messages</a>
            <a href="login.html">Logout</a>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <h2 id="babysitterName">Book a Babysitter</h2>
            <p><strong>Hourly Rate:</strong> <span id="hourlyRateDisplay">$18/hr</span></p>

            <label>Date:</label><br>
            <input id="date" type="date"><br><br>

            <label>Start Time:</label><br>
            <select id="startTime" onchange="calculateCost()">
                <option value="">Select</option>
                <option value="8">8 Am</option>
                <option value="9">9 Am</option>
                <option value="10">10 Am</option>
                <option value="11">11 Am</option>
                <option value="12">12 Pm</option>
                <option value="13">1 Pm</option>
                <option value="14">2 Pm</option>
                <option value="15">3 Pm</option>
                <option value="16">4 Pm</option>
                <option value="17">5 Pm</option>
                <option value="18">6 Pm</option>
                <option value="19">7 Pm</option>
                <option value="20">8 Pm</option>
            </select><br><br>

            <label>End Time:</label><br>
            <select id="endTime" onchange="calculateCost()">
                <option value="">Select</option>
                <option value="12">12 Pm</option>
                <option value="13">1 Pm</option>
                <option value="14">2 Pm</option>
                <option value="15">3 Pm</option>
                <option value="16">4 Pm</option>
                <option value="17">5 Pm</option>
                <option value="18">6 Pm</option>
                <option value="19">7 Pm</option>
                <option value="20">8 Pm</option>
                <option value="21">9 Pm</option>
                <option value="22">10 Pm</option>
            </select><br><br>

            <p><strong>Estimated Total:</strong> $<span id="cost">0</span></p>

            <button class="green-btn" type="button" onclick="confirmBooking()">
                Confirm Booking
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
